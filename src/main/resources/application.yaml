spring:
  application:
    name: nota-conecte-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nfse_saas}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
auth:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}
    frontend-url: ${FRONTEND_URL:http://localhost:4200}
    mail-enabled: ${PASSWORD_RESET_MAIL_ENABLED:false}
    mail-from: ${MAIL_FROM:nao-responda@notaconecte.com.br}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,https://nfse.contabilidadeconecte.com.br}
nfse:
  goiania:
    endpoint-producao: ${NFSE_GOIANIA_ENDPOINT_PRODUCAO:https://nfse.issnetonline.com.br/abrasf204/goiania/nfse.asmx}
    endpoint-homologacao: ${NFSE_GOIANIA_ENDPOINT_HOMOLOGACAO:}
  http:
    connect-timeout-seconds: ${NFSE_HTTP_CONNECT_TIMEOUT_SECONDS:10}
